<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - YuumCare</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-black fixed-top">
        <div class="container">
            <div class="logo">
                <img src="images/logo pequeño.png" alt="Logo YuumCare">
            </div>
            <a class="navbar-brand " href="#">YuumCare</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                
                </ul>
            </div>
        </div>
    </nav>

    <div class="registro-container">
        
        <div class="form-box">
            <h1 class="page-title">Registrar estudiante</h1>
            <p class="subtitle">Completa la información para darte de alta en el sistema.</p>

            <form class="styled-form">
                <div class="form-row">
                    <div class="input-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan">
                    </div>
                    <div class="input-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Ej. Pérez">
                    </div>
                </div>

                <div class="input-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@universidad.mx">
                </div>

                <div class="input-group">
                    <label for="carrera">Carrera</label>
                    <input type="text" id="carrera" name="carrera" placeholder="Ej. Ingeniería de Sistemas">
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="contraseña">Contraseña</label>
                        <input type="password" id="contraseña" name="contraseña">
                    </div>
                    <div class="input-group">
                        <label for="confirmar">Confirmar contraseña</label>
                        <input type="password" id="confirmar" name="confirmar">
                    </div>
                </div>

                <div class="boton-container">
                    <button type="button" class="btn-submit">Registrar</button>
                </div>
            </form>
        </div>

        <div class="table-box">
            <h3>Estudiantes Registrados</h3>
            
            <div class="table-responsive">
                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Correo electrónico</th>
                            <th>Carrera</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Juan</td>
                            <td>Pérez</td>
                            <td>JuanPérez02@gmail.com</td>
                            <td>Ingeniería de Sistemas</td>
                            <td>
                                <button class="action-btn edit">Editar</button>
                                <button class="action-btn delete">Borrar</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Ana</td>
                            <td>García</td>
                            <td>Ana_Gar321@gmail.com</td>
                            <td>Administración</td>
                            <td>
                                <button class="action-btn edit">Editar</button>
                                <button class="action-btn delete">Borrar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>
</html>

<!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
